<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: oklch(95% 0.01 250);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: oklch(98% 0.005 280);
      border: 1px solid oklch(85% 0.02 280);
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px oklch(0% 0 0 / 0.08);
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 8px 32px oklch(0% 0 0 / 0.12);
    }

    .card-header {
      font-size: 1.25rem;
      font-weight: 600;
      color: oklch(25% 0.12 280);
      margin-bottom: 0.75rem;
    }

    .card-body {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: oklch(45% 0.04 280);
      margin-bottom: 1.25rem;
    }

    .card-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: oklch(98% 0 0);
      background: oklch(55% 0.18 280);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .card-button:hover {
      background: oklch(50% 0.18 280);
    }

    .card-button:active {
      transform: scale(0.98);
    }

    @media (min-width: 768px) {
      .card {
        padding: 2rem;
        max-width: 480px;
      }

      .card-header {
        font-size: 1.5rem;
      }

      .card-body {
        font-size: 1rem;
      }

      .card-button {
        padding: 0.875rem 2rem;
      }
    }
  </style>
</head>
<body>
  <article class="card">
    <h2 class="card-header">Getting Started</h2>
    <p class="card-body">
      Build modern interfaces with oklch colors that feel natural and accessible.
      This card adapts smoothly from mobile to desktop viewports.
    </p>
    <button class="card-button">
      Learn More
    </button>
  </article>
</body>
</html>
