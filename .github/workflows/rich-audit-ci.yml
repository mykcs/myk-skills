name: host-self-evolve CI (manual fallback)

on:
  workflow_dispatch:

concurrency:
  group: host-self-evolve-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation fallback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CI dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run provider-neutral repository validation
        run: python3 scripts/ci_check.py
