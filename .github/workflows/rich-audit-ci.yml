name: rich-audit CI

on:
  push:
    branches: [main]
    paths:
      - 'rich-audit/**'
      - '.github/workflows/rich-audit-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rich-audit/**'
      - '.github/workflows/rich-audit-ci.yml'
  workflow_dispatch:  # allow manual re-run from UI / gh cli

# 防止 rich-audit 自己 trigger 自己 (递归 CI)
concurrency:
  group: rich-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unittest (10 tests, 4 detection scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Stub ~/.claude (read-only detection)
        # rich-audit 检测 ~/.claude/; CI 上是空的, 应该 pass
        run: |
          mkdir -p ~/.claude/knowledge/cases/wiki
          echo "# CI stub" > ~/.claude/knowledge/cases/wiki/README.md
          mkdir -p ~/.claude/hooks ~/.claude/scripts ~/.claude/rules ~/.claude/memory
          echo "# CI stub" > ~/.claude/memory/MEMORY.md
          # Stub a script so lint_runner has >=1 file to scan
          printf '#!/bin/bash\necho "stub"\n' > ~/.claude/scripts/stub.sh
          chmod +x ~/.claude/scripts/stub.sh
          # commands/ for commands_to_skills_migrator
          mkdir -p ~/.claude/commands
          echo "# stub command" > ~/.claude/commands/stub-cmd.md

      - name: Stub ~/.agents/skills (skill detection scripts need this)
        # 3 detection scripts (skill_overlap_enhancer / skill_authoring_checker /
        # description_person_checker / reference_depth_checker) read ~/.agents/skills/.
        # CI runner has no symlink, so create a minimal stub with 1 valid skill.
        run: |
          mkdir -p ~/.agents/skills/stub-skill
          cat > ~/.agents/skills/stub-skill/SKILL.md <<'EOF'
          ---
          name: stub-skill
          description: Stub skill for CI testing - this is a third-person description.
          metadata:
            version: "1.0.0"
          ---
          # Stub Skill
          CI stub for detection script smoke tests.
          EOF

      - name: Run unittest (10 tests)
        working-directory: rich-audit
        run: python3 -m unittest scripts.test_detection_scripts -v

      - name: Run dead_code_detector (smoke)
        working-directory: rich-audit
        run: python3 scripts/dead_code_detector.py | python3 -c "import json,sys; d=json.load(sys.stdin); print('count:',d['count']); assert d['tool']=='dead_code_detector.py'"

      - name: Run lint_runner (smoke)
        working-directory: rich-audit
        run: python3 scripts/lint_runner.py | python3 -c "import json,sys; d=json.load(sys.stdin); print('scanned:',d['scanned_sh'],'sh+',d['scanned_py'],'py'); assert d['tool']=='lint_runner.py'"

  modernize:
    name: Modernization Check (Tri-Search Protocol v2.6 + consistency 6d)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Tri-Search Protocol v2.6 in SKILL.md
        run: |
          if ! grep -q "§A.2 Layer 2b" rich-audit/SKILL.md; then
            echo "❌ Tri-Search Protocol v2.6 not in SKILL.md"
            exit 1
          fi
          echo "✅ Tri-Search Protocol v2.6 found"
      - name: Verify consistency 6d sub-modules
        run: |
          for n in 1 2 3 4 5 6; do
            test -f "rich-audit/references/consistency-6d/${n}-"*.md || { echo "❌ consistency-6d/${n} missing"; exit 1; }
          done
          echo "✅ 6 consistency sub-modules present"
      - name: Verify 8 detection scripts
        run: |
          SCRIPTS="dead_code_detector.py commands_to_skills_migrator.py lint_runner.py memory_audit_runner.py skill_authoring_checker.py skill_overlap_enhancer.py waste_token_detector.py auto_fix_proposer.py"
          for s in $SCRIPTS; do
            test -f "rich-audit/scripts/$s" || { echo "❌ $s missing"; exit 1; }
          done
          echo "✅ 8 detection scripts present"
      - name: Verify tests pass (10 tests)
        run: |
          cd rich-audit && python3 -m unittest scripts.test_detection_scripts 2>&1 | tail -3
